name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cross-impl:
    runs-on: ubuntu-latest
    env:
      # uv must use the interpreters set up below and never fetch its own.
      # A missing version then fails with a clear error instead of a
      # download that can time out mid-run.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build + test Go reference
        run: |
          cd go
          go build -o ../bin/vitni-verify-go ./cmd/vitni-verify
          go test ./... -coverpkg=./... -coverprofile=coverage.out -covermode=atomic

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build + test TS reference
        run: |
          cd ts
          npm install
          npm run build
          npx c8 --reporter=lcov --reports-dir=coverage npm test

      - name: Restore Python 3.10 from the Actions cache
        # The runner image ships 3.13 but no longer ships 3.10 (end of life
        # October 2026), so setup-python would download it on every run.
        # Keeping the interpreter in the Actions cache limits that download
        # to a cache miss. ImageOS is in the key so a new runner OS never
        # restores binaries built for the old one.
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/Python/3.10.*
          key: toolcache-python-3.10-${{ env.ImageOS }}-${{ runner.arch }}-v1

      - name: Set up Pythons (3.13 from the runner image, 3.10 from the Actions cache)
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.13

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"

      - name: Python verifier unit tests (stdlib only, both supported Pythons)
        env:
          VITNI_REQUIRE_NODE: "1"
        run: |
          for v in 3.10 3.13; do
            uv run --no-project --python "$v" python -I -m unittest discover -s py/tests -t py
          done

      - name: Python verifier coverage (3.13 only)
        # Reporting only. A separate step so the unit-test step above stays
        # stdlib-only with no --with; coverage is a measuring tool, not a
        # dependency of the verifier or of its tests.
        env:
          VITNI_REQUIRE_NODE: "1"
        run: |
          uv run --no-project --python 3.13 --with coverage coverage run --branch --include=py/vitni_verify.py -m unittest discover -s py/tests -t py
          uv run --no-project --python 3.13 --with coverage coverage xml -o py/coverage.xml

      - name: Cross-implementation conformance (Go, TS and Python, byte-identical in scope)
        # One run per Python version. No pipe: the step's status is the
        # harness's status. REQUIRE_IMPLS makes a missing impl a harness failure.
        run: |
          for v in 3.10 3.13; do
            REQUIRE_IMPLS=go,ts,py \
            PY_VERIFY="uv run --no-project --python $v python -I py/vitni_verify.py" \
              node conformance/compare.mjs
          done

      - name: Python verifier cross-check against a second implementation
        run: uv run --no-project --python 3.13 --with cryptography==50.0.2 python -I -m unittest discover -s py/tests_cross -t py

      - name: Python verifier imports nothing outside the standard library
        run: |
          if grep -nE 'cryptography|ecdsa|nacl' py/vitni_verify.py; then
            echo "py/vitni_verify.py names a third-party crypto package"
            exit 1
          fi

      - name: Harness self-tests
        run: node --test conformance/*.test.mjs

      - name: Profile tagger tests
        run: uv run --no-project python conformance/vectors/test_profiles.py

      - name: Vector regeneration is clean (every vector is generator-owned)
        # Delete every vector, rerun every generator, require an unchanged tree:
        # one check for idempotence AND for a vector no generator writes. The
        # dependency pins are the ones in CONTRIBUTING.md.
        run: |
          rm -f conformance/vectors/*.json
          cd conformance/vectors
          uv run --no-project python _gen.py
          uv run --no-project python _gen_a2a.py
          uv run --no-project --with cryptography==50.0.2 --with ecdsa==0.19.2 python _gen_verify.py
          uv run --no-project --with cryptography==50.0.2 --with ecdsa==0.19.2 python _gen_chain.py
          cd ../..
          if [ -n "$(git status --porcelain conformance/vectors)" ]; then
            git status --porcelain conformance/vectors
            echo "vector regeneration changed the tree"
            exit 1
          fi

      - name: Upload Go coverage to Codecov
        # Reporting only — no coverage threshold gates the build. The upload
        # no-ops gracefully when CODECOV_TOKEN is unset, so a missing secret
        # never turns CI red.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Daily-Nerd/vitni
          files: ./go/coverage.out
          flags: go
          fail_ci_if_error: false

      - name: Upload TS coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Daily-Nerd/vitni
          files: ./ts/coverage/lcov.info
          flags: ts
          fail_ci_if_error: false

      - name: Upload Python coverage to Codecov
        # Reporting only, same as Go and TS: no threshold, and a missing
        # CODECOV_TOKEN never turns CI red.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Daily-Nerd/vitni
          files: ./py/coverage.xml
          flags: py
          fail_ci_if_error: false
