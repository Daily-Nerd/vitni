name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cross-impl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build + test Go reference
        run: |
          cd go
          go build -o ../bin/vitni-verify-go ./cmd/vitni-verify
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build + test TS reference
        run: |
          cd ts
          npm install
          npm run build
          npx c8 --reporter=lcov --reports-dir=coverage npm test

      - name: Cross-implementation conformance (Go ≡ TS, byte-identical)
        run: node conformance/compare.mjs

      - name: Upload Go coverage to Codecov
        # Reporting only — no coverage threshold gates the build. The upload
        # no-ops gracefully when CODECOV_TOKEN is unset, so a missing secret
        # never turns CI red.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Daily-Nerd/vitni
          files: ./go/coverage.out
          flags: go
          fail_ci_if_error: false

      - name: Upload TS coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Daily-Nerd/vitni
          files: ./ts/coverage/lcov.info
          flags: ts
          fail_ci_if_error: false
